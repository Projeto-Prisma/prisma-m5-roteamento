spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5437/roteamento}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PG_USER:prisma}
spring.datasource.password=${PG_PASSWORD:prisma_secret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:prisma}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:prisma_secret}

m5.secretarias-api-url=${SECRETARIAS_API_URL:http://m9-secretarias:8000}
m5.secretarias-timeout-ms=${SECRETARIAS_TIMEOUT_MS:3000}

server.port=8000
springdoc.api-docs.path=/api-docs
